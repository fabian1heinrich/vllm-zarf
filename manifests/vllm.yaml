apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      # Avoid Kubernetes service env var injection like VLLM_PORT=tcp://...
      # which conflicts with vLLM's own VLLM_PORT parsing.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:v0.29.0-x86_64@sha256:66064cf683152e60eff2e5b18ec2d4ace236fb063c0a241f918691db9caddcf4
          imagePullPolicy: IfNotPresent
          env:
            # CPU vLLM uses this env var for KV cache sizing. Two GiB supports
            # one full native-context request; increase it for concurrency.
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
          command:
            - vllm
            - serve
          args:
            - /models/Qwen2.5-7B-Instruct
            - --served-model-name
            - Qwen/Qwen2.5-7B-Instruct
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 20Gi
            limits:
              cpu: "8"
              memory: 24Gi
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 2
            # startupProbe gates liveness checks until model init is complete.
            initialDelaySeconds: 0
          volumeMounts:
            - name: model-seed
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-seed
          image:
            reference: ghcr.io/fabian1heinrich/vllm-zarf/qwen:2.5-7b-instruct@sha256:59b4a01d4e56f14b3997af400ed33c90d336a43f247aeb742637c3d02f304f1b
            pullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
